<meta charset="utf-8"><!--@theme:head-->
<style>
/* 主题切换按钮 + 原生控件配色（由 tools/theme.py 注入，勿手改） */
html[data-theme="dark"]{color-scheme:dark}
html[data-theme="light"]{color-scheme:light}
/* 强调色的「原色版」：浅色下等于强调色本身，深色下由派生表换成压暗后的实心底色。
   凡是把强调色当实心底、上面压白字的地方都用 --p1s 这类变量（否则白字会糊）。 */
:root{--bg:#f6f8fb;--card:#fff;--line:#e3e8ef;--text:#16232e;--muted:#5f7183;--p1:#1f5fa8;
--p1s:var(--p1);--p2s:var(--p2);--p3s:var(--p3);--p4s:var(--p4);--dangers:var(--danger)}
html[data-theme="dark"]{--bg:#0f1620;--card:#16202b;--line:#243342;--text:#e6edf5;
--muted:#93a6b8;--p1:#63a9ee}
body{transition:background-color .18s,color .18s}
::selection{background:rgba(99,169,238,.32)}
.thbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;
border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);
font:inherit;font-size:12.5px;font-weight:700;line-height:1;cursor:pointer;
white-space:nowrap;flex:0 0 auto}
.thbtn:hover{color:var(--text);border-color:var(--p1)}
.thbtn:focus-visible{outline:2px solid var(--p1);outline-offset:2px}
.thbtn .thi svg{width:15px;height:15px;display:block}
.thbtn .thlbl{display:inline}
/* 窄屏顶栏本来就挤（返回 / 标题 / 课件 / 勾选），再塞按钮会横向溢出 14px，
   所以窄屏由脚本把按钮挪到 body 上变成右下角悬浮（顶栏有 backdrop-filter，
   直接给它 position:fixed 会被顶栏接管定位，跑到屏幕外）。 */
.thbtn.fixed{position:fixed;right:18px;bottom:74px;z-index:70;height:40px;padding:0 14px;
box-shadow:0 6px 20px rgba(0,0,0,.28)}
@media(max-width:640px){.thbtn.fixed{right:14px;bottom:74px;height:36px;padding:0 12px}}
/* 白底课件图（幻灯片截图）在深色下是一片刺眼的亮块：压一点亮度当「纸面」看。
   只压这三类课件图，普通插图/头像不受影响；进入全屏放映时恢复原亮度，
   保证放映颜色和下载的 pptx 一致。 */
html[data-theme="dark"] .stage-img,html[data-theme="dark"] .cell img,
html[data-theme="dark"] .ppt-thumb img{filter:brightness(.9)}
:fullscreen .stage-img,:fullscreen .cell img{filter:none}
html[data-theme="dark"] :fullscreen .stage-img,
html[data-theme="dark"] :fullscreen .cell img{filter:none}
</style>

<style>
:root{--bg:#eef2f7;--card:#fff;--line:#d8e3ee;--text:#16232e;--muted:#55687a;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);line-height:1.7;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
a{color:var(--p1);text-decoration:none}
a:hover{text-decoration:underline}

/* 顶栏 */
.top{position:sticky;top:0;z-index:30;background:rgba(238,242,247,.94);
backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 22px;display:flex;
align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-size:17px;font-weight:700}
.badge{font-size:12.5px;font-weight:700;color:#fff;background:var(--p3);
border-radius:5px;padding:3px 10px}
.spacer{flex:1}
.btn{font-size:13.5px;border:1px solid var(--line);background:#fff;color:var(--p1);
border-radius:8px;padding:7px 13px;cursor:pointer;font-family:inherit;font-weight:600}
.btn:hover{background:#f2f7fd;text-decoration:none}
.btn.primary{background:var(--p1);color:#fff;border-color:var(--p1)}
.btn.primary:hover{background:#1a5192}

/* 主体 */
.wrap{max-width:1180px;margin:0 auto;padding:22px 22px 60px}
h1{font-size:24px;margin:6px 0 4px}
.sub{color:var(--muted);font-size:14.5px;margin:0 0 18px}

/* 舞台 */
.stage{background:var(--card);border:1px solid var(--line);border-radius:14px;
box-shadow:0 2px 12px rgba(22,35,46,.06);overflow:hidden}
.stage-img{display:block;width:100%;height:auto;background:#fff}
.bar{display:flex;align-items:center;gap:12px;padding:12px 16px;
border-top:1px solid var(--line);flex-wrap:wrap}
.bar .t{font-size:15px;font-weight:700}
.bar .u{font-size:12.5px;color:var(--muted)}
.bar .u a{font-weight:600}

/* 缩略图 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
gap:12px;margin-top:22px}
.cell{background:var(--card);border:2px solid var(--line);border-radius:10px;
padding:0;cursor:pointer;overflow:hidden;text-align:left;font-family:inherit;
transition:border-color .12s,transform .12s}
.cell:hover{border-color:var(--p1);transform:translateY(-2px)}
.cell.on{border-color:var(--p3);box-shadow:0 0 0 3px rgba(224,138,21,.16)}
.cell img{display:block;width:100%;height:auto}
.cell .cap{padding:8px 10px;font-size:12.5px;color:var(--text);display:flex;
gap:7px;align-items:baseline}
.cell .no{font-weight:700;color:var(--p1);font-variant-numeric:tabular-nums}

/* 说明条 */
.note{background:#fff;border:1px solid var(--line);border-left:4px solid var(--p2);
border-radius:10px;padding:14px 18px;margin-top:22px;font-size:14px;color:#3a4a58}
.note b{color:var(--p2)}
kbd{background:#f2f5f9;border:1px solid var(--line);border-bottom-width:2px;
border-radius:5px;padding:1px 6px;font-size:12.5px;font-family:inherit}

@media (max-width:640px){.top-in,.wrap{padding-left:14px;padding-right:14px}
h1{font-size:20px}.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}}

/* 打印：一页一图 */
@media print{.top,.grid,.bar,.note{display:none}
.stage{border:0;box-shadow:none}.stage-img{page-break-after:always}}

:where(html[data-theme="dark"]) h1{font-size:24px;margin:6px 0 4px}
:where(html[data-theme="dark"]) .sub{color:var(--muted);font-size:14.5px;margin:0 0 18px}
:where(html[data-theme="dark"]) .stage{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 12px rgba(22,35,46,.06);overflow:hidden}
:where(html[data-theme="dark"]) .stage-img{display:block;width:100%;height:auto;background:#182129}
:where(html[data-theme="dark"]) .bar{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
:where(html[data-theme="dark"]) .bar .t{font-size:15px;font-weight:700}

:where(html[data-theme="dark"]) .cell:hover{border-color:var(--p1);transform:translateY(-2px)}

:where(html[data-theme="dark"]) .cell .cap{padding:8px 10px;font-size:12.5px;color:var(--text);display:flex;gap:7px;align-items:baseline}

:where(html[data-theme="dark"]) .note b{color:var(--p2)}

@media (max-width:640px){
:where(html[data-theme="dark"]) .top-in,:where(html[data-theme="dark"]) .wrap{padding-left:14px;padding-right:14px}

:where(html[data-theme="dark"]) .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
}
}
</style>

<script>
var S = [{"n": 1, "t": "封面", "r": "hero", "u": ""}, {"n": 2, "t": "课程坐标", "r": "supporting", "u": ""}, {"n": 3, "t": "22 个单元全景", "r": "hero", "u": ""}, {"n": 4, "t": "90 分钟课节结构", "r": "supporting", "u": ""}, {"n": 5, "t": "零基础教学三原则", "r": "supporting", "u": ""}, {"n": 6, "t": "单元 1–3 · 先把地基拍实", "r": "supporting", "u": "1,2,3"}, {"n": 7, "t": "单元 4–6 · 让程序会做判断", "r": "supporting", "u": "4,5,6"}, {"n": 8, "t": "单元 7 · 函数", "r": "hero", "u": "7"}, {"n": 9, "t": "单元 8 · 类", "r": "hero", "u": "8"}, {"n": 10, "t": "单元 9–10 · 从「能跑」到「靠谱」", "r": "supporting", "u": "9,10"}, {"n": 11, "t": "单元 11 · 总复习 + 关卡验收", "r": "transition", "u": "11"}, {"n": 12, "t": "关卡 1 · 四项全部达标", "r": "hero", "u": "11"}, {"n": 13, "t": "从「能写」到「能交付」", "r": "transition", "u": ""}, {"n": 14, "t": "项目一 · 外星人入侵", "r": "supporting", "u": "12,13,14"}, {"n": 15, "t": "项目二 · 数据可视化", "r": "supporting", "u": "15,16,17"}, {"n": 16, "t": "项目三 · 学习笔记 Web", "r": "supporting", "u": "18,19,20"}, {"n": 17, "t": "阶段 2 的统一工程流程", "r": "supporting", "u": ""}, {"n": 18, "t": "关卡 2 · 判定「能独立做项目」", "r": "hero", "u": "21"}, {"n": 19, "t": "练习题库 · 六档递进", "r": "supporting", "u": ""}, {"n": 20, "t": "常见卡点与对策", "r": "supporting", "u": ""}, {"n": 21, "t": "综合项目 · 三选一", "r": "supporting", "u": "11"}, {"n": 22, "t": "阶段 3 · 从会写代码到会交付软件", "r": "supporting", "u": ""}, {"n": 23, "t": "结束页", "r": "hero", "u": ""}];
var cur = 0;
var img = document.getElementById('img');
var tt  = document.getElementById('tt');
var uu  = document.getElementById('uu');
var pg  = document.getElementById('pg');
var grid= document.getElementById('grid');

function pad(n){ return (n<10?'0':'')+n; }
function src(n){ return 'slide-'+pad(n)+'.webp'; }

function show(i, push){
  if(i<0) i=0; if(i>=S.length) i=S.length-1;
  cur=i; var s=S[i];
  img.src=src(s.n);
  tt.textContent=s.t;
  if(s.u){
    var us=s.u.split(',');
    uu.innerHTML='对应单元 '+us.map(function(x){
      return '<a href="../lessons/index.html#u'+x+'">'+x+'</a>';
    }).join(' / ');
  } else { uu.textContent=''; }
  pg.textContent=(i+1)+' / '+S.length;
  var cells=grid.children;
  for(var k=0;k<cells.length;k++) cells[k].className='cell'+(k===i?' on':'');
  if(push!==false) history.replaceState(null,'','#s'+s.n);
}

S.forEach(function(s,i){
  var b=document.createElement('button');
  b.className='cell'; b.type='button';
  b.innerHTML='<img loading="lazy" src="'+src(s.n)+'" alt=""><span class="cap">'+
    '<span class="no">'+pad(s.n)+'</span><span>'+s.t+'</span></span>';
  b.onclick=function(){ show(i); window.scrollTo({top:0,behavior:'smooth'}); };
  grid.appendChild(b);
});

document.getElementById('prev').onclick=function(){ show(cur-1); };
document.getElementById('next').onclick=function(){ show(cur+1); };

document.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft'||e.key==='PageUp'){ show(cur-1); e.preventDefault(); }
  else if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){ show(cur+1); e.preventDefault(); }
  else if(e.key==='Home'){ show(0); }
  else if(e.key==='End'){ show(S.length-1); }
});

// 支持 #s14 深链
function fromHash(){
  var m=/^#s(\d+)$/.exec(location.hash||'');
  if(!m) return 0;
  var n=parseInt(m[1],10);
  for(var i=0;i<S.length;i++) if(S[i].n===n) return i;
  return 0;
}
window.addEventListener('hashchange',function(){ show(fromHash(), false); });
show(fromHash(), false);
</script>

<script>(function(){
var KEY='py-theme-v1',ORDER=['auto','light','dark'];

function build(){

  b.innerHTML='<span class="thi"></span><span class="thlbl"></span>';
  var host=document.querySelector('.top-in')||document.querySelector('.nav-in');
  var mq=window.matchMedia?window.matchMedia('(max-width:640px)'):null;
  if(host){host.appendChild(b)}else{document.body.appendChild(b)}
  function home(){
    var el=document.getElementById('thBtn');if(!el)return;
    var small=mq&&mq.matches;
    if(!host||small){
      if(el.parentElement!==document.body)document.body.appendChild(el);
      el.classList.add('fixed');
    }else{
      if(el.parentElement!==host)host.appendChild(el);
      el.classList.remove('fixed');

  if(mq&&mq.addEventListener)mq.addEventListener('change',home);
  window.__thHome=home;
  b.addEventListener('click',function(){apply(ORDER[(ORDER.indexOf(mode())+1)%3],true)});
  return b;

build();sync(mode());
if(q){var f=function(){if(mode()==='auto')apply('auto',false)};
  q.addEventListener?q.addEventListener('change',f):q.addListener(f)}
window.__theme={get mode(){return mode()},get dark(){return root.getAttribute('data-theme')==='dark'},
  set:function(m){apply(m,true)}};
/* Shift+T：不碰鼠标也能换主题（输入框聚焦时让位给打字） */
document.addEventListener('keydown',function(e){
  if(e.shiftKey&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&(e.key==='T'||e.key==='t')){
    var a=document.activeElement;
    if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT'||a.isContentEditable))return;
    apply(ORDER[(ORDER.indexOf(mode())+1)%3],true);e.preventDefault();
  }
});
})();</script>
<!--/@theme:body-->
<!-- neuron:begin -->
<script>(function(){
var KEY='py-neuron-v1';
var DEF={on:1,dense:'mid',follow:1,speed:'mid'};
var DENSE={low:.55,mid:1,high:1.75};
var SPEED={slow:.35,mid:1,fast:1.9};
var raw=null,cfg={};
try{raw=localStorage.getItem(KEY)}catch(e){}
try{cfg=raw?JSON.parse(raw):{}}catch(e){cfg={}}
for(var k in DEF){if(typeof cfg[k]!==typeof DEF[k])cfg[k]=DEF[k]}
if(!DENSE[cfg.dense])cfg.dense='mid';
if(!SPEED[cfg.speed])cfg.speed='mid';
// 系统开了「减少动效」且用户没自己选过：默认不铺背景，别跟系统设置对着干
var rm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)');
if(!raw&&rm&&rm.matches)cfg.on=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify(cfg))}catch(e){}}

var CSS=
'#neuronCv{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;'+
'pointer-events:none;opacity:.62}'+
'#nrBtn{position:fixed;right:18px;bottom:22px;z-index:70;display:inline-flex;'+
'align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;'+
'border:1px solid var(--line,#e3e8ef);background:var(--card,#fff);'+
'color:var(--muted,#5f7183);font:inherit;font-size:12.5px;font-weight:700;'+
'line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(20,40,70,.13);'+
'opacity:.92;transition:opacity .15s,color .15s}'+
'#nrBtn:hover{opacity:1;color:var(--text,#16232e);border-color:var(--p1,#1f5fa8)}'+
'#nrBtn.on{color:var(--p1,#1f5fa8)}'+
'#nrBtn svg{width:15px;height:15px;display:block}'+
'#nrPanel{position:fixed;right:18px;bottom:62px;z-index:71;width:224px;'+
'background:var(--card,#fff);border:1px solid var(--line,#e3e8ef);'+
'border-radius:12px;padding:12px 14px;box-shadow:0 10px 30px rgba(20,40,70,.18);'+
'font:inherit;font-size:13px;color:var(--text,#16232e);display:none}'+
'#nrPanel.open{display:block}'+
'#nrPanel .row{display:flex;align-items:center;justify-content:space-between;'+
'gap:10px;padding:6px 0}'+
'#nrPanel .row+.row{border-top:1px solid var(--line,#e3e8ef)}'+
'#nrPanel .lb{font-size:12.5px;color:var(--muted,#5f7183);white-space:nowrap}'+
'#nrPanel .seg{display:flex;gap:4px}'+
'#nrPanel button{font:inherit;font-size:12px;font-weight:700;cursor:pointer;'+
'border:1px solid var(--line,#e3e8ef);background:transparent;'+
'color:var(--muted,#5f7183);border-radius:7px;padding:4px 8px;line-height:1}'+
'#nrPanel button.sel{background:var(--p1s,var(--p1,#1f5fa8));'+
'border-color:var(--p1s,var(--p1,#1f5fa8));color:#fff}'+
'#nrPanel .sw{min-width:44px}'+
'#nrPanel .sw.on{background:var(--p1s,var(--p1,#1f5fa8));'+
'border-color:var(--p1s,var(--p1,#1f5fa8));color:#fff}'+
'@media print{#neuronCv,#nrBtn,#nrPanel{display:none!important}}'+
'@media(max-width:640px){#nrBtn{right:14px;bottom:14px;height:30px;padding:0 10px}'+
'#nrPanel{right:14px;bottom:52px;width:calc(100vw - 28px);max-width:250px}}';
var st=document.createElement('style');st.textContent=CSS;document.head.appendChild(st);

var cv=document.createElement('canvas');
cv.id='neuronCv';cv.setAttribute('aria-hidden','true');
if(document.body)document.body.insertBefore(cv,document.body.firstChild);
else document.addEventListener('DOMContentLoaded',function(){
  document.body.insertBefore(cv,document.body.firstChild);});
var ctx=cv.getContext('2d');
var W=0,H=0,nodes=[],mx=-1,my=-1,hasM=false,raf=0;

function target(){
  var n=Math.round(W*H/17000*DENSE[cfg.dense]);
  return Math.max(16,Math.min(150,n));
}
function seed(){
  var n=target(),i;
  while(nodes.length>n)nodes.pop();
  while(nodes.length<n)nodes.push({x:Math.random()*W,y:Math.random()*H,
    vx:(Math.random()-.5)*.24,vy:(Math.random()-.5)*.24,r:Math.random()*1.3+1.1});
  for(i=0;i<nodes.length;i++){
    if(nodes[i].x>W)nodes[i].x=Math.random()*W;
    if(nodes[i].y>H)nodes[i].y=Math.random()*H;
  }
}
function resize(){
  var dpr=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  if(!W||!H)return;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  seed();
}
function frame(){
  raf=requestAnimationFrame(frame);
  var dark=document.documentElement.getAttribute('data-theme')==='dark';
  var dot=dark?'150,196,240':'31,95,168';
  var lin=dark?'99,169,238':'72,106,140';
  ctx.clearRect(0,0,W,H);
  var sp=SPEED[cfg.speed],i,j,a,b,dx,dy,d2,s;
  // 密度越高连线越短：否则节点一多就糊成一片网，看不出「神经元」
  var LINK=132/Math.sqrt(DENSE[cfg.dense]),L2=LINK*LINK;
  var MR=150,MR2=MR*MR;
  for(i=0;i<nodes.length;i++){
    a=nodes[i];
    a.x+=a.vx*sp;a.y+=a.vy*sp;
    if(a.x<-24)a.x=W+24;else if(a.x>W+24)a.x=-24;
    if(a.y<-24)a.y=H+24;else if(a.y>H+24)a.y=-24;
    if(hasM&&cfg.follow){
      dx=mx-a.x;dy=my-a.y;d2=dx*dx+dy*dy;
      if(d2<MR2&&d2>1){
        s=Math.sqrt(d2);
        a.vx+=dx/s*(1-s/MR)*.03;a.vy+=dy/s*(1-s/MR)*.03;
      }
    }
    // 限速：鼠标一直吸着会让节点越飞越快，最后整屏乱窜
    s=a.vx*a.vx+a.vy*a.vy;
    if(s>.36){s=Math.sqrt(s);a.vx=a.vx/s*.6;a.vy=a.vy/s*.6;}
  }
  ctx.lineWidth=1;
  for(i=0;i<nodes.length;i++){
    a=nodes[i];
    for(j=i+1;j<nodes.length;j++){
      b=nodes[j];dx=a.x-b.x;dy=a.y-b.y;d2=dx*dx+dy*dy;
      if(d2>L2)continue;
      ctx.strokeStyle='rgba('+lin+','+((1-Math.sqrt(d2)/LINK)*.4).toFixed(3)+')';
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    }
  }
  if(hasM&&cfg.follow){
    for(i=0;i<nodes.length;i++){
      a=nodes[i];dx=a.x-mx;dy=a.y-my;d2=dx*dx+dy*dy;
      if(d2>MR2)continue;
      ctx.strokeStyle='rgba('+dot+','+((1-Math.sqrt(d2)/MR)*.45).toFixed(3)+')';
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(mx,my);ctx.stroke();
    }
    ctx.fillStyle='rgba('+dot+',.5)';
    ctx.beginPath();ctx.arc(mx,my,2.6,0,6.284);ctx.fill();
  }
  for(i=0;i<nodes.length;i++){
    a=nodes[i];
    ctx.fillStyle='rgba('+dot+',.5)';
    ctx.beginPath();ctx.arc(a.x,a.y,a.r,0,6.284);ctx.fill();
  }
}
function start(){if(!raf){raf=requestAnimationFrame(frame)}}
function stop(){if(raf){cancelAnimationFrame(raf);raf=0}ctx.clearRect(0,0,W,H)}

var ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"'+
 'stroke-linecap="round"><circle cx="5" cy="6.5" r="1.9"/><circle cx="19" cy="8.5" r="1.9"/>'+
 '<circle cx="9" cy="18" r="1.9"/><circle cx="17.5" cy="17.5" r="1.4"/>'+
 '<path d="M5 6.5 19 8.5 9 18 5 6.5M19 8.5 17.5 17.5 9 18"/></svg>';
var btn=document.createElement('button');
btn.type='button';btn.id='nrBtn';
btn.innerHTML=ICON+'<span class="nrbt"></span>';
btn.setAttribute('aria-haspopup','true');
btn.setAttribute('aria-expanded','false');
var panel=document.createElement('div');
panel.id='nrPanel';
panel.setAttribute('role','group');
panel.setAttribute('aria-label','神经元背景设置');
panel.innerHTML=
 '<div class="row"><span class="lb">神经元背景</span>'+
 '<button type="button" class="sw" data-k="on"></button></div>'+
 '<div class="row"><span class="lb">密度</span><span class="seg" data-k="dense">'+
 '<button type="button" data-v="low">低</button>'+
 '<button type="button" data-v="mid">中</button>'+
 '<button type="button" data-v="high">高</button></span></div>'+
 '<div class="row"><span class="lb">鼠标跟随</span>'+
 '<button type="button" class="sw" data-k="follow"></button></div>'+
 '<div class="row"><span class="lb">动效</span><span class="seg" data-k="speed">'+
 '<button type="button" data-v="slow">静</button>'+
 '<button type="button" data-v="mid">缓</button>'+
 '<button type="button" data-v="fast">快</button></span></div>';
document.body.appendChild(btn);document.body.appendChild(panel);

function paint(){
  btn.classList.toggle('on',!!cfg.on);
  btn.querySelector('.nrbt').textContent=cfg.on?'背景 开':'背景 关';
  btn.setAttribute('aria-pressed',cfg.on?'true':'false');
  btn.title=cfg.on?'神经元背景：开（点击调整）':'神经元背景：关（点击调整）';
  var sw=panel.querySelectorAll('.sw');
  for(var i=0;i<sw.length;i++){
    var k=sw[i].getAttribute('data-k');
    sw[i].classList.toggle('on',!!cfg[k]);
    sw[i].textContent=cfg[k]?'开':'关';
    sw[i].setAttribute('aria-pressed',cfg[k]?'true':'false');
  }
  var sg=panel.querySelectorAll('.seg');
  for(i=0;i<sg.length;i++){
    var kk=sg[i].getAttribute('data-k'),bs=sg[i].querySelectorAll('button');
    for(var j=0;j<bs.length;j++)
      bs[j].classList.toggle('sel',bs[j].getAttribute('data-v')===cfg[kk]);
  }
}
function apply(){
  if(!W||!H)resize();
  cv.style.display=cfg.on?'':'none';
  if(cfg.on&&!document.hidden){seed();start()}else stop();
  paint();
}
btn.addEventListener('click',function(e){
  e.stopPropagation();
  panel.classList.toggle('open');
  btn.setAttribute('aria-expanded',panel.classList.contains('open')?'true':'false');
});
panel.addEventListener('click',function(e){
  var t=e.target;
  while(t&&t!==panel){
    if(t.getAttribute){
      var v=t.getAttribute('data-v');
      if(v){cfg[t.parentNode.getAttribute('data-k')]=v;save();apply();return}
      var k=t.getAttribute('data-k');
      if(k&&t.className.indexOf('sw')>=0){cfg[k]=cfg[k]?0:1;save();apply();return}
    }
    t=t.parentNode;
  }
});
document.addEventListener('click',function(e){
  if(!panel.classList.contains('open'))return;
  if(panel.contains(e.target)||btn.contains(e.target))return;
  panel.classList.remove('open');btn.setAttribute('aria-expanded','false');
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&panel.classList.contains('open')){
    panel.classList.remove('open');btn.setAttribute('aria-expanded','false');
    btn.focus();
  }
});
window.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;hasM=true},{passive:true});
document.addEventListener('mouseleave',function(){hasM=false});
window.addEventListener('blur',function(){hasM=false});
window.addEventListener('touchmove',function(e){
  var t=e.touches&&e.touches[0];if(t){mx=t.clientX;my=t.clientY;hasM=true}},{passive:true});
window.addEventListener('touchend',function(){hasM=false});
var rt=0;
window.addEventListener('resize',function(){
  clearTimeout(rt);rt=setTimeout(function(){if(cfg.on)resize()},180)});
document.addEventListener('visibilitychange',function(){
  if(document.hidden)stop();else if(cfg.on)start()});

resize();apply();
window.__neuron={get cfg(){return cfg},set:function(k,v){cfg[k]=v;save();apply()},
  count:function(){return nodes.length}};
})();</script>
<!-- neuron:end -->
</body>
</html>
