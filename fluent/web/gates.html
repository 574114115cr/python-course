<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><!--@theme:head-->
<style>
/* 主题切换按钮 + 原生控件配色（由 tools/theme.py 注入，勿手改） */
html[data-theme="dark"]{color-scheme:dark}
html[data-theme="light"]{color-scheme:light}
/* 强调色的「原色版」：浅色下等于强调色本身，深色下由派生表换成压暗后的实心底色。
   凡是把强调色当实心底、上面压白字的地方都用 --p1s 这类变量（否则白字会糊）。 */
:root{--bg:#f6f8fb;--card:#fff;--line:#e3e8ef;--text:#16232e;--muted:#5f7183;--p1:#1f5fa8;
--p1s:var(--p1);--p2s:var(--p2);--p3s:var(--p3);--p4s:var(--p4);--dangers:var(--danger)}
html[data-theme="dark"]{--bg:#0f1620;--card:#16202b;--line:#243342;--text:#e6edf5;
--muted:#93a6b8;--p1:#63a9ee}
body{transition:background-color .18s,color .18s}
::selection{background:rgba(99,169,238,.32)}
.thbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;
border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);
font:inherit;font-size:12.5px;font-weight:700;line-height:1;cursor:pointer;
white-space:nowrap;flex:0 0 auto}
.thbtn:hover{color:var(--text);border-color:var(--p1)}
.thbtn:focus-visible{outline:2px solid var(--p1);outline-offset:2px}
.thbtn .thi svg{width:15px;height:15px;display:block}
.thbtn .thlbl{display:inline}
/* 窄屏顶栏本来就挤（返回 / 标题 / 课件 / 勾选），再塞按钮会横向溢出 14px，
   所以窄屏由脚本把按钮挪到 body 上变成右下角悬浮（顶栏有 backdrop-filter，
   直接给它 position:fixed 会被顶栏接管定位，跑到屏幕外）。 */
.thbtn.fixed{position:fixed;right:18px;bottom:74px;z-index:70;height:40px;padding:0 14px;
box-shadow:0 6px 20px rgba(0,0,0,.28)}
@media(max-width:640px){.thbtn.fixed{right:14px;bottom:74px;height:36px;padding:0 12px}}
</style>
<script>(function(){var m='auto';try{m=localStorage.getItem('py-theme-v1')||'auto'}catch(e){}if(m!=='light'&&m!=='dark')m='auto';var q=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)');var d=m==='dark'||(m==='auto'&&q&&q.matches);var r=document.documentElement;r.setAttribute('data-theme-mode',m);r.setAttribute('data-theme',d?'dark':'light');})();</script>
<!--/@theme:head-->

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>关卡验收</title>
<meta name="theme-color" content="#4c3a9e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234c3a9e'/%3E%3Ctext x='16' y='22' font-size='13' font-family='monospace' fill='%23fff' text-anchor='middle'%3EFP%3C/text%3E%3C/svg%3E">
<script>
window.FL = { read: function (k, d) {
  try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; }
  catch (e) { return d; }
} };
</script>
<link rel="stylesheet" href="css/site.css">

</head>
<body >
<div class="top"><div class="top-in">
  <a class="back" href="../index.html">← 课程首页</a>
  <h1>关卡验收</h1>
  
  
  <a class="switch" href="../../index.html">切换课程</a>
</div></div>
<div class="wrap">
  <div class="hero" style="padding:38px 40px">
    <div class="bdg">GATES</div>
    <h1>两个关卡 · 判定「真的会了」</h1>
    <p>关卡不是考试，是验收：每条都必须能当场演示或讲清楚。做完勾选，进度存在本机。</p>
  </div>
  <div class="gate" data-key="g1">
  <h2>关卡 1 · 数据结构、函数与对象</h2><div class="gs">覆盖单元 1–6 ｜ 建议在第 12 周完成后验收</div>
  <label><input type="checkbox" data-g="g1" data-i="0"><span>能自定义一个类，支持 len / 索引 / 切片 / for / repr，并解释调用链</span></label><label><input type="checkbox" data-g="g1" data-i="1"><span>能用 listcomp 与 genexp 各写一版等价代码，并说明内存差异</span></label><label><input type="checkbox" data-g="g1" data-i="2"><span>能解释 dict 的键为什么必须可哈希，以及插入顺序为何被保留</span></label><label><input type="checkbox" data-g="g1" data-i="3"><span>能复现并修复一次 UnicodeDecodeError，说明 bytes 与 str 的边界</span></label><label><input type="checkbox" data-g="g1" data-i="4"><span>能用 @dataclass 定义带默认值、后处理与冻结选项的值对象</span></label><label><input type="checkbox" data-g="g1" data-i="5"><span>能解释浅拷贝、深拷贝与函数传参的引用语义</span></label><label><input type="checkbox" data-g="g1" data-i="6"><span>能把函数当参数/返回值传递，并用 operator / functools 简化代码</span></label><label><input type="checkbox" data-g="g1" data-i="7"><span>能给公开函数写全参数与返回值注解，并通过 mypy 检查</span></label><label><input type="checkbox" data-g="g1" data-i="8"><span>能徒手写出一个带参数的装饰器，并保留被装饰函数的元数据</span></label><label><input type="checkbox" data-g="g1" data-i="9"><span>能用闭包 + 装饰器重构一段策略分支代码</span></label><label><input type="checkbox" data-g="g1" data-i="10"><span>能实现 __repr__ / __eq__ / __hash__ 三者自洽的值类型</span></label><label><input type="checkbox" data-g="g1" data-i="11"><span>能实现一个可切片、可迭代、可格式化的自定义序列</span></label>
  <div class="gp"><b id="n_g1">0 / 12</b>
    <div class="dbar" style="flex:1"><i id="b_g1"></i></div>
    <a href="../index.html#units">回到单元首页</a></div>
</div>
  <div class="gate" data-key="g2">
  <h2>关卡 2 · 类、并发与元编程</h2><div class="gs">覆盖单元 7–12 ｜ 建议在第 24 周完成后验收</div>
  <label><input type="checkbox" data-g="g2" data-i="0"><span>能区分鸭子类型、静态协议与 ABC，并为同一接口各写一版实现</span></label><label><input type="checkbox" data-g="g2" data-i="1"><span>能画出一次多重继承的 MRO，并解释 super() 的协作式调用</span></label><label><input type="checkbox" data-g="g2" data-i="2"><span>能用 TypeVar / Generic / Protocol 写出可被类型检查器接受的泛型代码</span></label><label><input type="checkbox" data-g="g2" data-i="3"><span>能为自定义类型实现 +、*、@、比较运算符且不破坏交换律</span></label><label><input type="checkbox" data-g="g2" data-i="4"><span>能手写生成器函数与 yield from，说明惰性求值的收益与代价</span></label><label><input type="checkbox" data-g="g2" data-i="5"><span>能实现上下文管理器，并用 match 解构嵌套数据结构</span></label><label><input type="checkbox" data-g="g2" data-i="6"><span>能解释 GIL 对 CPU 密集与 IO 密集任务的不同影响</span></label><label><input type="checkbox" data-g="g2" data-i="7"><span>能用 concurrent.futures 改写串行下载并处理异常与超时</span></label><label><input type="checkbox" data-g="g2" data-i="8"><span>能写出 asyncio 并发任务，正确使用 gather / TaskGroup 与超时</span></label><label><input type="checkbox" data-g="g2" data-i="9"><span>能说明协程、线程、进程三者的适用边界</span></label><label><input type="checkbox" data-g="g2" data-i="10"><span>能用 __getattr__ / property / 描述符分别实现动态属性</span></label><label><input type="checkbox" data-g="g2" data-i="11"><span>能读懂一个元类，并判断何时该用 __init_subclass__ 代替它</span></label>
  <div class="gp"><b id="n_g2">0 / 12</b>
    <div class="dbar" style="flex:1"><i id="b_g2"></i></div>
    <a href="../index.html#units">回到单元首页</a></div>
</div>
</div>
<script>
(function(){
  ['g1','g2'].forEach(function(k){
    var box=document.querySelector('.gate[data-key="'+k+'"]');
    var st=FL.read('fl-gate'+k.slice(1)+'-v1',{});
    var ins=[].slice.call(box.querySelectorAll('input'));
    function paint(){
      var n=0;ins.forEach(function(x){x.closest('label').classList.toggle('on',x.checked);
        if(x.checked)n++;});
      document.getElementById('n_'+k).textContent=n+' / '+ins.length;
      document.getElementById('b_'+k).style.width=(n/ins.length*100)+'%';
    }
    ins.forEach(function(x){x.checked=!!st[x.dataset.i];
      x.addEventListener('change',function(){
        if(x.checked)st[x.dataset.i]=1; else delete st[x.dataset.i];
        try{localStorage.setItem('fl-gate'+k.slice(1)+'-v1',JSON.stringify(st))}catch(e){}
        paint();
      })});
    paint();
  });
})();
</script>

<script>
(function(){
  function read(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
  window.FL={read:read};

  document.querySelectorAll('pre').forEach(function(pre){
    if(pre.querySelector('.cp')) return;
    var b=document.createElement('button');
    b.className='cp';b.type='button';b.textContent='复制';
    b.addEventListener('click',function(){
      var code=pre.querySelector('code')||pre, txt=code.innerText;
      function ok(){b.textContent='已复制 ✓';b.classList.add('ok');
        setTimeout(function(){b.textContent='复制';b.classList.remove('ok')},1500);}
      function fb(){var t=document.createElement('textarea');t.value=txt;
        t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);
        t.select();try{document.execCommand('copy');ok()}catch(e){}
        document.body.removeChild(t);}
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(ok,fb);
      }else fb();
    });
    pre.appendChild(b);
  });

  var top=document.createElement('button');
  top.id='toTop';top.type='button';top.title='回到顶部';top.textContent='↑';
  document.body.appendChild(top);
  function sync(){top.classList.toggle('on',window.scrollY>500)}
  window.addEventListener('scroll',sync,{passive:true});sync();
  top.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'})});

  // 目录当前项高亮
  var links=[].slice.call(document.querySelectorAll('.toc a'));
  var pairs=links.map(function(a){
    var t=document.getElementById(a.getAttribute('href').slice(1));
    return t?[a,t]:null;
  }).filter(Boolean);
  function spy(){
    if(!pairs.length) return;
    var cur=pairs[0][0];
    var atBottom = window.innerHeight + window.scrollY
                   >= document.documentElement.scrollHeight - 4;
    if(atBottom){
      cur = pairs[pairs.length-1][0];
    }else{
      var y=window.scrollY+150;
      pairs.forEach(function(p){
        var top=p[1].getBoundingClientRect().top+window.scrollY;
        if(top<=y) cur=p[0];
      });
    }
    links.forEach(function(a){ a.classList.toggle('cur',a===cur); });
  }
  spy();window.addEventListener('scroll',spy,{passive:true});
})();
</script>
<!--@theme:body-->
<script>(function(){
var KEY='py-theme-v1',ORDER=['auto','light','dark'];
var LABEL={auto:'跟随系统',light:'浅色',dark:'深色'};
var ICON={
auto:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor" stroke="none"/></svg>',
light:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.1M12 19.3v2.1M4.6 4.6l1.5 1.5M17.9 17.9l1.5 1.5M2.6 12h2.1M19.3 12h2.1M4.6 19.4l1.5-1.5M17.9 6.1l1.5-1.5"/></svg>',
dark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20.5 14.8A8.6 8.6 0 0 1 9.2 3.5a8.6 8.6 0 1 0 11.3 11.3z"/></svg>'};
var root=document.documentElement;
var q=window.matchMedia?window.matchMedia('(prefers-color-scheme:dark)'):null;
function mode(){var m=root.getAttribute('data-theme-mode');return ORDER.indexOf(m)<0?'auto':m}
function sync(m){
  var b=document.getElementById('thBtn');
  root.setAttribute('data-theme-mode',m);
  var d=root.getAttribute('data-theme')==='dark';
  var meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.setAttribute('content',d?'#0f1620':'#1f5fa8');
  if(!b)return;
  b.title='主题：'+LABEL[m]+'　点一下切换（跟随系统 → 浅色 → 深色）';
  b.setAttribute('aria-label','主题：'+LABEL[m]+'，点击切换');
  var i=b.querySelector('.thi'),t=b.querySelector('.thlbl');
  if(i)i.innerHTML=ICON[m];if(t)t.textContent=LABEL[m];
}
function apply(m,save){
  var d=m==='dark'||(m==='auto'&&q&&q.matches);
  root.setAttribute('data-theme',d?'dark':'light');
  if(save){try{localStorage.setItem(KEY,m)}catch(e){}}
  sync(m);
}
function build(){
  var b=document.createElement('button');
  b.type='button';b.id='thBtn';b.className='thbtn';
  b.innerHTML='<span class="thi"></span><span class="thlbl"></span>';
  var host=document.querySelector('.top-in')||document.querySelector('.nav-in');
  var mq=window.matchMedia?window.matchMedia('(max-width:640px)'):null;
  if(host){host.appendChild(b)}else{document.body.appendChild(b)}
  function home(){
    var el=document.getElementById('thBtn');if(!el)return;
    var small=mq&&mq.matches;
    if(!host||small){
      if(el.parentElement!==document.body)document.body.appendChild(el);
      el.classList.add('fixed');
    }else{
      if(el.parentElement!==host)host.appendChild(el);
      el.classList.remove('fixed');
    }
  }
  home();
  if(mq&&mq.addEventListener)mq.addEventListener('change',home);
  window.__thHome=home;
  b.addEventListener('click',function(){apply(ORDER[(ORDER.indexOf(mode())+1)%3],true)});
  return b;
}
build();sync(mode());
if(q){var f=function(){if(mode()==='auto')apply('auto',false)};
  q.addEventListener?q.addEventListener('change',f):q.addListener(f)}
window.__theme={get mode(){return mode()},get dark(){return root.getAttribute('data-theme')==='dark'},
  set:function(m){apply(m,true)}};
})();</script>
<!--/@theme:body-->
</body>
</html>
